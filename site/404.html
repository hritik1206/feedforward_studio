<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | FeedForward Studio</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23FB7A3C'/><stop offset='.55' stop-color='%23EC3B8A'/><stop offset='1' stop-color='%237C2FE0'/></linearGradient></defs><rect width='32' height='32' rx='8' fill='url(%23g)'/><path d='M7 16h13' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/><path d='M15 10l6 6-6 6' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
  :root{--paper:#F4EFE6;--ink:#17140F;--muted:#6B6356;--signal:#7C2FE0;--grad:linear-gradient(120deg,#FB7A3C,#EC3B8A 52%,#7C2FE0);}
  @media (prefers-color-scheme: dark){:root{--paper:#141210;--ink:#F4EFE6;--muted:#A79C8C;--signal:#9D6BFF;}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:Georgia,"Times New Roman",serif;display:grid;place-items:center;text-align:center;padding:2rem}
  .wrap{max-width:32rem}
  .code{font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;font-weight:800;font-size:clamp(4.5rem,20vw,9rem);line-height:1;letter-spacing:-.04em;color:var(--signal);}
  @supports ((-webkit-background-clip:text) or (background-clip:text)){.code{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}}
  h1{font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;font-weight:800;font-size:clamp(1.4rem,5vw,2.1rem);margin:.4rem 0 1rem;letter-spacing:-.02em}
  p{color:var(--muted);font-size:1.08rem;line-height:1.6;margin:0 0 2rem}
  .btn{display:inline-flex;align-items:center;gap:.5em;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;font-weight:700;text-decoration:none;background:var(--signal);color:#fff;padding:.8em 1.4em;border-radius:999px;transition:transform .18s ease}
  .btn:hover{transform:translateY(-2px)}
  a:focus-visible,.btn:focus-visible{outline:2.5px solid var(--signal);outline-offset:3px;border-radius:8px}
</style>
</head>
<body>
  <main class="wrap">
    <div class="code" aria-hidden="true">404</div>
    <h1>This page took a wrong turn.</h1>
    <p>The page you're looking for moved or never existed. Let's get you back to the feed.</p>
    <a class="btn" href="/">← Back to home</a>
  </main>
</body>
</html>

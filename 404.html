<style>
  :root{--paper:#F4EFE6;--ink:#17140F;--muted:#6B6356;--signal:#7C2FE0;--grad:linear-gradient(120deg,#D9631F,#EC3B8A 52%,#7C2FE0);}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#141210;--ink:#F4EFE6;--muted:#A79C8C;--signal:#9D6BFF;--grad:linear-gradient(120deg,#FB7A3C,#EC3B8A 52%,#9D6BFF);}}
  :root[data-theme="dark"]{--paper:#141210;--ink:#F4EFE6;--muted:#A79C8C;--signal:#9D6BFF;--grad:linear-gradient(120deg,#FB7A3C,#EC3B8A 52%,#9D6BFF);}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:Georgia,"Times New Roman",serif;display:grid;place-items:center;text-align:center;padding:2rem}
  .wrap{max-width:32rem}
  .mark{display:block;margin:0 auto 1rem;height:64px;width:auto}
  .code{font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;font-weight:800;font-size:clamp(4.5rem,20vw,9rem);line-height:1;letter-spacing:-.04em;color:var(--signal);}
  @supports ((-webkit-background-clip:text) or (background-clip:text)){.code{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}}
  h1{font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;font-weight:800;font-size:clamp(1.4rem,5vw,2.1rem);margin:.4rem 0 1rem;letter-spacing:-.02em}
  p{color:var(--muted);font-size:1.08rem;line-height:1.6;margin:0 0 2rem}
  .btn{display:inline-flex;align-items:center;gap:.5em;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;font-weight:700;text-decoration:none;background:var(--signal);color:#fff;padding:.8em 1.4em;border-radius:999px;transition:transform .18s ease}
  :root[data-theme="dark"] .btn{color:#141210}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#141210}}
  .btn:hover{transform:translateY(-2px)}
  a:focus-visible,.btn:focus-visible{outline:2.5px solid var(--signal);outline-offset:3px;border-radius:8px}
  @media (prefers-reduced-motion: reduce){.btn{transition:none}.btn:hover{transform:none}}
</style>
